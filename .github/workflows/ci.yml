name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --extra design --extra imaging --extra mcp --extra web
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy dobladillo
      - run: uv run pytest -q

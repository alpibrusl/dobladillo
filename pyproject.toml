[project]
name = "dobladillo"
version = "0.0.1"
description = "A scriptable toolchain for DNA origami bricks: design, simulate, fold, measure, compare."
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
classifiers = [
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    # Q5's acceptance criterion asks for plots alongside the JSON, so this is
    # part of the deliverable rather than a convenience. Every dependency must
    # be OSI open source and compatible with EUPL-1.2; tests/test_licences.py
    # enforces it.
    "matplotlib>=3.8",
    # Duplex thermodynamics (dobladillo.sequence.thermo). GPL-2.0-or-later,
    # which EUPL-1.2 lists as compatible; see tests/test_licences.py. Core, not
    # an extra: it is the source of truth for every latch field, and an
    # optional source of truth is one CI never checks. A C extension with
    # x86-64 wheels only, so arm64 installs compile it (needs a C compiler).
    "primer3-py>=2.0",
    # Trajectory alignment, mean structure and RMSF (dobladillo.analysis._oat).
    # GPL-3.0; see tests/test_licences.py. Pinned to the oxDNA release the
    # simulations run on, and taken from that tag rather than PyPI, whose
    # newest upload (2.0.5, 2024) predates it. Pure Python plus one Cython
    # reader; it does not need oxpy or a compiled oxDNA. Always built from
    # source, so installs need a C compiler. Pulls in scikit-learn and through
    # it scipy, joblib, threadpoolctl, cloudpickle (BSD-3-Clause) and narwhals (MIT).
    "oxDNA-analysis-tools @ git+https://github.com/lorenzo-rovigatti/oxDNA@v3.7.0#subdirectory=analysis",
]

[project.optional-dependencies]
# scadnano is the design data model. Pinned: its API moves, and DESIGN.md s10
# lists that drift as a known risk, so every call goes through an adapter.
design = ["scadnano==0.21.1"]
# The AFM module is meant to be usable on its own, by a lab that has no
# interest in scadnano or oxDNA. So its dependencies live here rather than in
# the core, and the measurement code takes a plain height map rather than
# anything this project defines.
imaging = [
    "scipy>=1.11",
    # Native instrument formats (Bruker .spm, JPK, .ibw, .gwy, .asd, WSXM).
    # GPL-3.0-only: fine to combine with EUPL-1.2, and it matters the day
    # anything is distributed. See dobladillo.imaging.readers.
    "afmreader==0.0.7",
    # Skeletonisation for tracing rods (dobladillo.imaging.rods). BSD-3-Clause;
    # already installed through afmreader's pySPM, declared because it is now
    # imported directly. See tests/test_licences.py.
    "scikit-image>=0.22",
]
# Indentation mechanics. LorenaRedondo/nanoindent is not on an index,
# so this extra cannot install it; it is declared to record the dependency and
# to keep `dobladillo.mechanics` honest about needing something it cannot pull.
# Install nanoindent from its own checkout. See mechanics.NANOINDENT_NOTE.
mechanics = []
# httpx2: the HTTP client Starlette's TestClient drives the web UI's tests with.
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "scipy>=1.11", "hypothesis>=6.100", "httpx2>=2.0"]
mcp = [
    "mcp>=2.2,<3",  # MCPServer; FastMCP in 1.x had another API
]
# The local web UI (`dobladillo web`): server-rendered HTML forms over the
# CLI's --json contract, bound to 127.0.0.1. No JavaScript library and nothing
# fetched at run time. See dobladillo/web and tests/test_licences.py.
web = [
    "starlette>=1.0",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "markdown-it-py>=3.0",  # renders pre/plan.md and pre/protocol.md, raw HTML off
]

[project.scripts]
dobladillo = "dobladillo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# oxDNA-analysis-tools is a git reference; see the dependency's comment.
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options as call results in argument defaults. That is the
# library's interface, not the mutable-default bug B008 is looking for.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# 3.12 rather than the 3.11 the package supports at run time: numpy's bundled
# stubs use 3.12-only `type` statement syntax, so type-checking against 3.11
# fails inside numpy before it reaches our code. Nothing here uses 3.12-only
# syntax, so requires-python stays at 3.11; this is the checker's target, not
# the package's floor.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# scadnano ships no py.typed marker, so everything crossing that boundary is
# Any. The adapter converts at the edge rather than letting it spread; this
# only stops mypy complaining that the import itself is untyped.
module = ["scadnano.*", "openpyxl.*", "scipy.*", "nanoindent.*", "primer3.*", "oxDNA_analysis_tools.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# The dashboard renderer embeds a stylesheet and a page as string literals.
# Wrapping CSS rules and HTML tags at 100 columns to satisfy a linter makes
# both harder to read than the thing the rule is protecting against.
"dobladillo/dashboard/render.py" = ["E501"]

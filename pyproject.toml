[project]
name = "dobladillo"
version = "0.0.1"
description = "A scriptable toolchain for DNA origami bricks: design, simulate, fold, measure, compare."
requires-python = ">=3.11"
license = { text = "EUPL-1.2" }
classifiers = [
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    # Q5's acceptance criterion asks for plots alongside the JSON, so this is
    # part of the deliverable rather than a convenience. Every dependency must
    # be OSI open source and compatible with EUPL-1.2; tests/test_licences.py
    # enforces it.
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# scadnano is the design data model. Pinned: its API moves, and DESIGN.md s10
# lists that drift as a known risk, so every call goes through an adapter.
design = ["scadnano==0.21.1"]
# Thermodynamics. dobladillo.sequence.thermo implements the SantaLucia 1998
# nearest-neighbour table directly -- published numbers, not anyone's code --
# so the core needs nothing. primer3-py is GPL-2.0-or-later and stays optional; it is
# here as the independent implementation the tests check that table against,
# which is the only way a single mistranscribed parameter would ever show up.
thermo = ["primer3-py>=2.0"]
# The AFM module is meant to be usable on its own, by a lab that has no
# interest in scadnano or oxDNA. So its dependencies live here rather than in
# the core, and the measurement code takes a plain height map rather than
# anything this project defines.
imaging = ["scipy>=1.11"]
# Indentation mechanics. alpibrupa/nanoindent is private and not on an index,
# so this extra cannot install it; it is declared to record the dependency and
# to keep `dobladillo.mechanics` honest about needing something it cannot pull.
# Install nanoindent from its own checkout. See mechanics.NANOINDENT_NOTE.
mechanics = []
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "scipy>=1.11"]
mcp = [
    "mcp>=2.2,<3",  # MCPServer; FastMCP in 1.x had another API
]

[project.scripts]
dobladillo = "dobladillo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI options as call results in argument defaults. That is the
# library's interface, not the mutable-default bug B008 is looking for.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# 3.12 rather than the 3.11 the package supports at run time: numpy's bundled
# stubs use 3.12-only `type` statement syntax, so type-checking against 3.11
# fails inside numpy before it reaches our code. Nothing here uses 3.12-only
# syntax, so requires-python stays at 3.11; this is the checker's target, not
# the package's floor.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# scadnano ships no py.typed marker, so everything crossing that boundary is
# Any. The adapter converts at the edge rather than letting it spread; this
# only stops mypy complaining that the import itself is untyped.
module = ["scadnano.*", "openpyxl.*", "scipy.*", "nanoindent.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# The dashboard renderer embeds a stylesheet and a page as string literals.
# Wrapping CSS rules and HTML tags at 100 columns to satisfy a linter makes
# both harder to read than the thing the rule is protecting against.
"dobladillo/dashboard/render.py" = ["E501"]
